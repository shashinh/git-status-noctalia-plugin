id           = "shashinh/git-status"
name         = "Git Status"
version      = "0.3.0"
# Highest feature used: getSetting (get-setting, 26), which the service uses
# to find every bar widget instance and its repository. Also relies on
# direct-argv (24), module-require (22), plugin-ui-props (21),
# system-stats/nowMs (12) and ui-callback-closures (9).
plugin_api   = 26
author       = "shashinh"
license      = "GPL-3.0-or-later"
icon         = "git-branch"
description  = "Bar dots showing uncommitted changes in git repositories (one repo per widget, each with its own glyph), with a panel to review, commit, pull and push. Includes a NixOS configuration mode."
tags         = ["bar", "panel", "service", "indicator", "git", "nixos"]
dependencies = ["git", "inotify-tools"]

# Plugin-wide: how often every watched repository is checked.

[[setting]]
key             = "poll_interval_s"
type            = "int"
label_key       = "settings.poll_interval_s.label"
description_key = "settings.poll_interval_s.description"
default         = 30
min             = 5
max             = 3600

[[setting]]
key             = "fetch_interval_min"
type            = "int"
label_key       = "settings.fetch_interval_min.label"
description_key = "settings.fetch_interval_min.description"
default         = 10
min             = 0
max             = 1440

[[service]]
id    = "service"
entry = "service.luau"

# Per widget instance: each dot watches its own repository.

[[widget]]
id    = "dot"
entry = "dot.luau"

  [[widget.setting]]
  key             = "nixos_mode"
  type            = "bool"
  label_key       = "settings.nixos_mode.label"
  description_key = "settings.nixos_mode.description"
  default         = false

  [[widget.setting]]
  key             = "title"
  type            = "string"
  label_key       = "settings.title.label"
  description_key = "settings.title.description"
  default         = ""
  visible_when    = { key = "nixos_mode", values = [false] }

  [[widget.setting]]
  key             = "repo_path"
  type            = "folder"
  label_key       = "settings.repo_path.label"
  description_key = "settings.repo_path.description"
  visible_when    = { key = "nixos_mode", values = [false] }

  [[widget.setting]]
  key             = "glyph"
  type            = "glyph"
  label_key       = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default         = ""

  [[widget.setting]]
  key             = "hide_when_clean"
  type            = "bool"
  label_key       = "settings.hide_when_clean.label"
  description_key = "settings.hide_when_clean.description"
  default         = false

  [[widget.setting]]
  key             = "show_count"
  type            = "bool"
  label_key       = "settings.show_count.label"
  description_key = "settings.show_count.description"
  default         = false

  [[widget.setting]]
  key             = "right_click_refresh"
  type            = "bool"
  label_key       = "settings.right_click_refresh.label"
  description_key = "settings.right_click_refresh.description"
  default         = false

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 560
height          = 620
placement       = "attached"
position        = "auto"
open_near_click = true
